<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(1); }
      }
      @keyframes moveBar {
        0% { height: 40px; y: 160px; }
        50% { height: 180px; y: 20px; }
        100% { height: 40px; y: 160px; }
      }
      @keyframes moveBar2 {
        0% { height: 140px; y: 60px; }
        50% { height: 80px; y: 120px; }
        100% { height: 140px; y: 60px; }
      }
      .anim-pulse { animation: pulse 4s infinite ease-in-out; transform-origin: center; }
      .bar-1 { animation: moveBar 3s infinite ease-in-out; }
      .bar-2 { animation: moveBar2 2.5s infinite ease-in-out; }
    </style>
  </defs>
  
  <!-- Fundo Tecnológico -->
  <rect width="1200" height="400" fill="url(#bg)" rx="16"/>
  
  <!-- Círculos de luz de fundo animados -->
  <circle cx="950" cy="200" r="150" fill="#3b82f6" opacity="0.15" filter="url(#glow)" class="anim-pulse"/>
  <circle cx="200" cy="100" r="100" fill="#f97316" opacity="0.1" filter="url(#glow)"/>

  <!-- Grid de dados de fundo -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <path d="M0,100 H1200 M0,200 H1200 M0,300 H1200" />
    <path d="M300,0 V400 M600,0 V400 M900,0 V400" />
  </g>

  <!-- Gráficos de barras animados em loop (Lado Direito) -->
  <g transform="translate(820, 120)">
    <rect x="0" y="100" width="35" height="100" fill="#3b82f6" rx="6" opacity="0.8" class="bar-1"/>
    <rect x="50" y="60" width="35" height="140" fill="#f97316" rx="6" opacity="0.9" class="bar-2"/>
    <rect x="100" y="30" width="35" height="170" fill="#8b5cf6" rx="6" opacity="0.8" class="bar-1"/>
    <rect x="150" y="80" width="35" height="120" fill="#10b981" rx="6" opacity="0.9" class="bar-2"/>
    <rect x="200" y="20" width="35" height="180" fill="#3b82f6" rx="6" opacity="0.9" class="bar-1"/>
  </g>

  <!-- Linha de destaque inferior gradiente -->
  <rect x="0" y="390" width="1200" height="10" fill="url(#accent)" />

  <!-- Tipografia de Impacto -->
  <text x="80" y="130" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="4">ENTERPRISE ANALYTICS &amp; BI</text>
  <text x="80" y="195" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" filter="url(#glow)">Dashboard de Gestão de RH</text>
  <text x="80" y="240" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20">Análise de métricas corporativas, indicadores de talentos e Business Intelligence</text>
  
  <!-- Badge Power BI Animado -->
  <g transform="translate(80, 290)">
    <rect width="160" height="40" rx="20" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="80" y="25" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">POWER BI ACTIVE</text>
  </g>
</svg>
